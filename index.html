<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff6b9d">
<title>Meow Top Up</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    <img src="icon-512.png" alt="Meow">
    <h1>Meow Top Up 🐱💰</h1>
  </div>
</header>

<main>
  <section class="card">
    <h2>Pilih Game</h2>
    <div class="games">
      <button class="game-btn" data-game="ML">🎮 Mobile Legends</button>
      <button class="game-btn" data-game="FF">🔥 Free Fire</button>
      <button class="game-btn" data-game="PUBG">🎯 PUBG Mobile</button>
      <button class="game-btn" data-game="GI">⚔️ Genshin Impact</button>
      <button class="game-btn" data-game="HOK">👑 Honor of Kings</button>
      <button class="game-btn" data-game="VAL">🔫 Valorant</button>
    </div>
  </section>

  <section class="card">
    <h2>Data Akun</h2>
    <input type="text" id="userId" placeholder="User ID">
    <input type="text" id="serverId" placeholder="Server ID (opsional)">
  </section>

  <section class="card">
    <h2>Pilih Nominal</h2>
    <div class="nominals" id="nominals"></div>
  </section>

  <section class="card">
    <h2>Pembayaran</h2>
    <select id="payment">
      <option>DANA</option>
      <option>OVO</option>
      <option>GoPay</option>
      <option>ShopeePay</option>
      <option>QRIS</option>
    </select>
  </section>

  <button id="checkout" class="checkout">
    🐾 Checkout Sekarang
  </button>
</main>

<footer>
  <p>© 2025 Meow Top Up - Proses instan 24 jam 🐱</p>
</footer>

<script src="app.js"></script>
</body>
</html>
